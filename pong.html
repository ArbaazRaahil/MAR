<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="pong.css">
</head>
<body>
    <div class="container">
        <h1>🎮 PONG GAME 🎮</h1>
        
        <div class="game-wrapper">
            <canvas id="pongCanvas" width="800" height="400"></canvas>
        </div>

        <div class="scoreboard">
            <div class="score-container">
                <div class="score-label">Player</div>
                <div class="score" id="playerScore">0</div>
            </div>
            <div class="vs">VS</div>
            <div class="score-container">
                <div class="score-label">Computer</div>
                <div class="score" id="computerScore">0</div>
            </div>
        </div>

        <div class="controls">
            <h3>Controls</h3>
            <div class="control-item">⬆️ Arrow Up / W - Move Paddle Up</div>
            <div class="control-item">⬇️ Arrow Down / S - Move Paddle Down</div>
            <div class="control-item">🖱️ Move Mouse - Smooth Paddle Control</div>
            <div class="control-item">🎯 First to 11 points wins!</div>
        </div>

        <div class="button-group">
            <button id="resetBtn">🔄 New Game</button>
        </div>
    </div>

    <script src="pong.js"></script>
</body>
</html>
