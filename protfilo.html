<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            animation: fadeIn 1s ease-out 0.2s both;
        }

        p {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
            animation: fadeIn 1s ease-out 0.4s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        .social-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .social-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .social-btn:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .github { background: linear-gradient(135deg, #333, #555); }
        .twitter { background: linear-gradient(135deg, #1DA1F2, #1a8cd8); }
        .linkedin { background: linear-gradient(135deg, #0077B5, #005885); }
        .instagram { background: linear-gradient(135deg, #E4405F, #fd1d1d); }
        .email { background: linear-gradient(135deg, #EA4335, #c5221f); }
        .facebook { background: linear-gradient(135deg, #1877F2, #0a66c2); }

        .social-btn i {
            position: relative;
            z-index: 1;
        }

        .label {
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-img">👤</div>
        <h1>Your Name</h1>
        <p>Full Stack Developer & Designer</p>

        <div class="social-links">
            <a href="https://github.com" class="social-btn github" title="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://twitter.com" class="social-btn twitter" title="Twitter">
                <i class="fab fa-twitter"></i>
            </a>
            <a href="https://linkedin.com" class="social-btn linkedin" title="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
            <a href="https://instagram.com" class="social-btn instagram" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="mailto:your@email.com" class="social-btn email" title="Email">
                <i class="fas fa-envelope"></i>
            </a>
            <a href="https://facebook.com" class="social-btn facebook" title="Facebook">
                <i class="fab fa-facebook"></i>
            </a>
        </div>

        <div class="label">Connect with me on social media</div>
    </div>
</body>
</html>
